name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check-version -- "${GITHUB_REF_NAME}"

      - name: Run quality checks
        run: npm run check

      - name: Build rolling installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run package

      - name: Build versioned installers
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm run build
          npx electron-builder --win nsis portable --publish never \
            '-c.nsis.artifactName=ExcalidrawVisualizer-${version}-Windows-${arch}-Setup.${ext}' \
            '-c.portable.artifactName=ExcalidrawVisualizer-${version}-Windows-${arch}-Portable.${ext}'

      - name: List release files
        run: ls -lh release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers

      - name: Add checksums
        working-directory: installers
        run: sha256sum *.exe > SHA256SUMS.txt

      - name: Choose release channel
        id: target
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "title=Excalidraw Visualizer ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
            echo "display=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Excalidraw Visualizer ${version} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
            echo "display=${version} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        env:
          DISPLAY: ${{ steps.target.outputs.display }}
          ROLLING: ${{ steps.target.outputs.rolling }}
        run: |
          {
            echo "## Excalidraw Visualizer ${DISPLAY}"
            echo
            echo "| Windows download | Purpose |"
            echo "| --- | --- |"
            for file in installers/*.exe; do
              name="$(basename "$file")"
              if [[ "$name" == *Portable* ]]; then
                purpose="Portable executable; no installation required"
              else
                purpose="Installer with Start menu and .excalidraw file association"
              fi
              echo "| \`${name}\` | ${purpose} |"
            done
            echo
            echo "The app works offline and sends no telemetry. Packages are currently unsigned,"
            echo "so Windows SmartScreen may show a warning on first launch."
            echo
            echo "Built from commit \`${GITHUB_SHA}\`. Verify downloads with \`SHA256SUMS.txt\`."
            if [ "${ROLLING}" = "true" ]; then
              echo
              echo "This rolling release is rebuilt from the latest commit on \`main\`."
              echo "Permanent releases are created from version tags such as \`v0.1.0\`."
            fi
          } > release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          TITLE: ${{ steps.target.outputs.title }}
          ROLLING: ${{ steps.target.outputs.rolling }}
        run: |
          set -euo pipefail
          if [ "${ROLLING}" = "true" ]; then
            gh release delete "${TAG}" --yes --cleanup-tag || true
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --latest
            gh release upload "${TAG}" installers/* --clobber
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}" \
              --latest \
              installers/*
          fi
