name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build_windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check-version -- "${GITHUB_REF_NAME}"

      - name: Run quality checks
        run: npm run check

      - name: Build rolling installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run package

      - name: Build versioned installers
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm run prepare-whisper
          npm run build
          # shellcheck disable=SC2016
          npx electron-builder --win nsis portable --publish never \
            '-c.nsis.artifactName=ExcalidrawVisualizer-${version}-Windows-${arch}-Setup.${ext}' \
            '-c.portable.artifactName=ExcalidrawVisualizer-${version}-Windows-${arch}-Portable.${ext}'

      - name: Verify packaged speech resources
        shell: pwsh
        run: |
          $resources = "release\win-unpacked\resources\vendor\whisper"
          if ((Get-FileHash -Algorithm SHA256 "$resources\models\ggml-small.bin").Hash.ToLowerInvariant() -ne
              "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b") {
            throw "Packaged Whisper model hash is invalid"
          }
          if ((Get-FileHash -Algorithm SHA256 "$resources\models\ggml-silero-v5.1.2.bin").Hash.ToLowerInvariant() -ne
              "29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf") {
            throw "Packaged VAD model hash is invalid"
          }
          $whisper = Get-ChildItem "$resources\bin\windows-x64" -Recurse -File |
            Where-Object { $_.Name -in @("whisper-cli.exe", "main.exe", "whisper.exe") } |
            Select-Object -First 1
          if (-not $whisper) {
            throw "Missing packaged whisper.cpp executable"
          }

      - name: List release files
        run: ls -lh release/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build_macos:
    name: Build macOS disk images
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check-version -- "${GITHUB_REF_NAME}"

      - name: Build rolling disk images
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run package:mac

      - name: Build versioned disk images
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm run prepare-whisper
          npm run build
          # shellcheck disable=SC2016
          npx electron-builder --mac dmg --arm64 --x64 --publish never \
            '-c.dmg.artifactName=ExcalidrawVisualizer-${version}-macOS-${arch}.${ext}'

      - name: Verify packaged applications
        run: |
          set -euo pipefail
          for app in release/mac-arm64/*.app release/mac/*.app; do
            codesign --verify --deep --strict "$app"
            resources="$app/Contents/Resources/vendor/whisper"
            test "$(shasum -a 256 "$resources/models/ggml-small.bin" | cut -d' ' -f1)" = \
              "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
            test "$(shasum -a 256 "$resources/models/ggml-silero-v5.1.2.bin" | cut -d' ' -f1)" = \
              "29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf"
            helper_arches="$(lipo -archs "$resources/bin/macos-universal/whisper-cli")"
            grep -qw arm64 <<<"$helper_arches"
            grep -qw x86_64 <<<"$helper_arches"
          done

      - name: List release files
        run: ls -lh release/*.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build_windows, build_macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installers'
          path: installers
          merge-multiple: true

      - name: Add checksums
        working-directory: installers
        run: sha256sum -- ./* > SHA256SUMS.txt

      - name: Choose release channel
        id: target
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          {
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "tag=${GITHUB_REF#refs/tags/}"
              echo "title=Excalidraw Visualizer ${GITHUB_REF#refs/tags/}"
              echo "rolling=false"
              echo "display=${version}"
            else
              echo "tag=latest"
              echo "title=Excalidraw Visualizer ${version} (build ${GITHUB_RUN_NUMBER})"
              echo "rolling=true"
              echo "display=${version} (build ${GITHUB_RUN_NUMBER})"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          DISPLAY: ${{ steps.target.outputs.display }}
          ROLLING: ${{ steps.target.outputs.rolling }}
        run: |
          {
            echo "## Excalidraw Visualizer ${DISPLAY}"
            echo
            echo "| Windows download | Purpose |"
            echo "| --- | --- |"
            for file in installers/*.exe; do
              name="$(basename "$file")"
              if [[ "$name" == *Portable* ]]; then
                purpose="Portable executable; no installation required"
              else
                purpose="Installer with Start menu and .excalidraw file association"
              fi
              echo "| \`${name}\` | ${purpose} |"
            done
            echo
            echo "| macOS download | Purpose |"
            echo "| --- | --- |"
            for file in installers/*.dmg; do
              name="$(basename "$file")"
              if [[ "$name" == *arm64* ]]; then
                purpose="Apple silicon (M-series) disk image"
              else
                purpose="Intel x64 disk image"
              fi
              echo "| \`${name}\` | ${purpose} |"
            done
            echo
            echo "The app works offline and sends no telemetry. Packages are currently unsigned,"
            echo "so Windows SmartScreen and macOS Gatekeeper may show a warning on first launch."
            echo
            echo "Built from commit \`${GITHUB_SHA}\`. Verify downloads with \`SHA256SUMS.txt\`."
            if [ "${ROLLING}" = "true" ]; then
              echo
              echo "This rolling release is rebuilt from the latest commit on \`main\`."
              echo "Permanent releases are created from version tags such as \`v0.1.0\`."
            fi
          } > release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          TITLE: ${{ steps.target.outputs.title }}
          ROLLING: ${{ steps.target.outputs.rolling }}
        run: |
          set -euo pipefail
          if [ "${ROLLING}" = "true" ]; then
            gh release delete "${TAG}" --yes --cleanup-tag || true
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "${ROLLING}" = "true" ]; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md
            else
              gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --latest
            fi
            gh release upload "${TAG}" installers/* --clobber
          else
            if [ "${ROLLING}" = "true" ]; then
              gh release create "${TAG}" \
                --title "${TITLE}" \
                --notes-file release-notes.md \
                --target "${GITHUB_SHA}" \
                --latest=false \
                installers/*
            else
              gh release create "${TAG}" \
                --title "${TITLE}" \
                --notes-file release-notes.md \
                --target "${GITHUB_SHA}" \
                --latest \
                installers/*
            fi
          fi
