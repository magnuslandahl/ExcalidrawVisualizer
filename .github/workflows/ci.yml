name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  package:
    name: Windows packaging smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unpacked Windows app
        run: npm run package:dir

      - name: Verify packaged application
        shell: pwsh
        run: |
          $executable = "release\win-unpacked\ExcalidrawVisualizer.exe"
          $archive = "release\win-unpacked\resources\app.asar"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Missing packaged executable: $executable"
          }
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Missing packaged application archive: $archive"
          }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact=100 --verbose

      - name: Scan the commit history
        run: gitleaks git . --no-banner --redact=100 --verbose

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [quality, package, secrets]
    if: always()
    steps:
      - name: Report overall result
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "package: ${{ needs.package.result }}"
          echo "secrets: ${{ needs.secrets.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::At least one CI job did not succeed."
            exit 1
          fi
