name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  package_windows:
    name: Windows packaging smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unpacked Windows app
        run: npm run package:dir

      - name: Verify packaged application
        shell: pwsh
        run: |
          $executable = "release\win-unpacked\ExcalidrawVisualizer.exe"
          $archive = "release\win-unpacked\resources\app.asar"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Missing packaged executable: $executable"
          }
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Missing packaged application archive: $archive"
          }
          $model = "release\win-unpacked\resources\vendor\whisper\models\ggml-small.bin"
          $vad = "release\win-unpacked\resources\vendor\whisper\models\ggml-silero-v5.1.2.bin"
          $whisper = Get-ChildItem `
            "release\win-unpacked\resources\vendor\whisper\bin\windows-x64" `
            -Recurse -File |
            Where-Object { $_.Name -in @("whisper-cli.exe", "main.exe", "whisper.exe") } |
            Select-Object -First 1
          if ((Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne
              "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b") {
            throw "Packaged Whisper model hash is invalid"
          }
          if ((Get-FileHash -Algorithm SHA256 $vad).Hash.ToLowerInvariant() -ne
              "29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf") {
            throw "Packaged VAD model hash is invalid"
          }
          if (-not $whisper) {
            throw "Missing packaged whisper.cpp executable"
          }

  package_macos:
    name: macOS packaging and runtime smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Apple silicon and Intel disk images
        run: npm run package:mac

      - name: Verify packaged application runtime
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            app="release/mac-arm64/ExcalidrawVisualizer.app"
          else
            app="release/mac/ExcalidrawVisualizer.app"
          fi
          npm run smoke:mac -- "$app"

      - name: Verify both macOS architectures and disk images
        run: |
          set -euo pipefail
          for pair in \
            "release/mac-arm64/ExcalidrawVisualizer.app arm64" \
            "release/mac/ExcalidrawVisualizer.app x86_64"; do
            app="${pair% *}"
            arch="${pair##* }"
            executable="$app/Contents/MacOS/ExcalidrawVisualizer"
            test -f "$app/Contents/Resources/app.asar"
            file "$executable" | grep -q "$arch"
            codesign --verify --deep --strict "$app"
            resources="$app/Contents/Resources/vendor/whisper"
            test "$(shasum -a 256 "$resources/models/ggml-small.bin" | cut -d' ' -f1)" = \
              "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
            test "$(shasum -a 256 "$resources/models/ggml-silero-v5.1.2.bin" | cut -d' ' -f1)" = \
              "29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf"
            helper_arches="$(lipo -archs "$resources/bin/macos-universal/whisper-cli")"
            grep -qw arm64 <<<"$helper_arches"
            grep -qw x86_64 <<<"$helper_arches"
            codesign -dv --verbose=2 "$resources/bin/macos-universal/whisper-cli" 2>&1 |
              grep -q 'Signature=adhoc'
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0' \
              "$app/Contents/Info.plist" | grep -qx excalidraw
            /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
              "$app/Contents/Info.plist" | grep -qx 13.0
            /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' \
              "$app/Contents/Info.plist" | grep -q 'local feedback dictation'
          done

          for dmg in release/*.dmg; do
            mount_point="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
            test -d "$mount_point/Excalidraw Visualizer.app"
            test -e "$mount_point/Applications"
            instructions="$(find "$mount_point" -maxdepth 1 -name '*.txt' -print -quit)"
            test -n "$instructions"
            grep -q 'Open Anyway' "$instructions"
            grep -q 'damaged' "$instructions"
            hdiutil detach "$mount_point" >/dev/null
            rmdir "$mount_point"
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact=100 --verbose

      - name: Scan the commit history
        run: gitleaks git . --no-banner --redact=100 --verbose

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [quality, package_windows, package_macos, secrets]
    if: always()
    steps:
      - name: Report overall result
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "package-windows: ${{ needs.package_windows.result }}"
          echo "package-macos: ${{ needs.package_macos.result }}"
          echo "secrets: ${{ needs.secrets.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::At least one CI job did not succeed."
            exit 1
          fi
