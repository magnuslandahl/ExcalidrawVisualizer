appId: com.excalidrawvisualizer.app
productName: Excalidraw Visualizer
executableName: ExcalidrawVisualizer
publish: []
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ExcalidrawVisualizer-Windows-${arch}-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ExcalidrawVisualizer-Windows-${arch}-Portable.${ext}
fileAssociations:
  - ext: excalidraw
    name: Excalidraw Drawing
    description: Excalidraw drawing document
    role: Editor
    icon: build/file-icon.ico
